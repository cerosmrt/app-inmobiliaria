<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración inicial — Moret Inmobiliaria</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* Sans, no Georgia: es una pantalla del admin, y los remates ensucian
           labels chicos e inputs. Era la última página del panel con serif. */
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #FFFFFF;
            color: #333333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #F8F9FA;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(17,17,17,0.08);
            border: 1px solid #E5E7EB;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .brand { text-align: center; margin-bottom: 24px; }
        .brand img { width: 190px; max-width: 100%; height: auto; display: block; margin: 0 auto 8px; }
        .brand .sub { font-size: 11px; color: #6B7280; letter-spacing: 2px; text-transform: uppercase; }
        h2 { font-size: 16px; color: #111111; margin-bottom: 6px; text-align: center; }
        p { font-size: 13px; color: #666666; text-align: center; margin-bottom: 24px; }
        label { display: block; font-size: 12px; color: #6B7280; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #E5E7EB;
            border-radius: 7px; font-size: 14px; color: #333333; background: #FFFFFF;
            outline: none; margin-bottom: 16px; font-family: inherit;
        }
        input:focus { border-color: #C41230; }
        .btn { width: 100%; padding: 12px; background: #C41230; color: white; border: none; border-radius: 7px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn:hover { background: #a50e28; }
        .error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <img src="/static/logo.png?v=2" alt="Roberto Moret Inmobiliaria">
        <div class="sub">Configuración inicial</div>
    </div>
    <h2>Crear cuenta de administrador</h2>
    <p>Este formulario solo está disponible si no hay administradores registrados.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" placeholder="tu@email.com" autofocus required>
        <label>Usuario (opcional)</label>
        <input type="text" name="username" placeholder="Ej: roberto">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="Contraseña segura" required>
        <button type="submit" class="btn">Crear cuenta</button>
    </form>
</div>
</body>
</html>
