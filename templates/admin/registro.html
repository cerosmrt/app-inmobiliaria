<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta — Moret Inmobiliaria</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #FFFFFF; color: #333333; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: #F8F9FA; border-radius: 12px;
            box-shadow: 0 4px 24px rgba(17,17,17,0.08); border: 1px solid #E5E7EB;
            padding: 40px; width: 100%; max-width: 400px;
        }
        .brand { text-align: center; margin-bottom: 24px; }
        .brand img { width: 190px; max-width: 100%; height: auto; display: block; margin: 0 auto 8px; }
        .brand .sub { font-size: 11px; color: #6B7280; letter-spacing: 2px; text-transform: uppercase; }
        h2 { font-size: 16px; color: #111111; margin-bottom: 6px; text-align: center; }
        p { font-size: 13px; color: #666666; text-align: center; margin-bottom: 24px; }
        label { display: block; font-size: 12px; color: #6B7280; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #E5E7EB;
            border-radius: 7px; font-size: 14px; color: #333333; background: #FFFFFF;
            outline: none; margin-bottom: 16px; font-family: inherit;
        }
        input:focus { border-color: #C41230; }
        .btn { width: 100%; padding: 12px; background: #C41230; color: white; border: none; border-radius: 7px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn:hover { background: #a50e28; }
        .error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
        .foot { text-align: center; margin-top: 16px; font-size: 13px; }
        .foot a { color: #C41230; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <img src="/static/logo.png" alt="Roberto Moret Inmobiliaria">
        <div class="sub">Crear cuenta</div>
    </div>
    <h2>Activá tu cuenta</h2>
    <p>Usá el email que te habilitó el administrador y elegí tu contraseña.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email</label>
        <input type="email" name="email" placeholder="tu@email.com" autofocus required>
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="Elegí una contraseña" required>
        <button type="submit" class="btn">Crear cuenta</button>
    </form>
    <div class="foot"><a href="/admin/login">Ya tengo cuenta — iniciar sesión</a></div>
</div>
</body>
</html>
